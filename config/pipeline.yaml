# Pipeline parameters (plan sections 6.2, 6.4, 6.5, 6.9, 6.10). All team_estimate unless noted.
coverage:
  min_images_k: 2            # images needed for an edge side to count as observed
  camera_max_distance_m: 15  # camera position within this distance of the edge
  view_range_m: 20           # view cone range
  default_hfov_deg: 65
  camera_height_m: 1.3       # handheld default (6.4 ground-plane model)
  max_gps_accuracy_m: 25     # images with worse GPS accuracy do not count for coverage
  spherical_hfov_deg: 360    # 360 cameras see everything within view_range_m

mapillary:                   # plan 6.2; token from env MAPILLARY_TOKEN (human task)
  api_url: "https://graph.mapillary.com/images"
  fields: [id, computed_geometry, geometry, computed_compass_angle, compass_angle, captured_at,
           camera_parameters, camera_type, thumb_2048_url, sequence, creator, is_pano, width, height]
  page_limit: 500
  licence: "CC BY-SA 4.0"
  attribution_template: "Mapillary image {id} by {creator}, {licence} (https://www.mapillary.com/app/?pKey={id})"
  thumb_dir: "data/raw/mapillary"

geolocation:                 # plan 6.4
  distance_min_m: 1.0
  distance_max_m: 25.0
  distance_fallback_m: 6.0
  min_angle_below_horizon_deg: 2.0   # below this the ground-plane model is unreliable -> fallback
  road_search_m: 30.0                # nearest road centreline must be within this distance
  travel_direction_max_gap_s: 60     # previous image in the same session/sequence counts as travel direction if within this
  travel_direction_min_move_m: 2.0
  confidence:                        # team_estimate weights, sum to 1
    gps_accuracy: 0.35               # 1.0 at <= 5 m, 0 at >= 25 m
    distance: 0.25                   # 1.0 at <= 5 m, 0 at >= 25 m
    side_agreement: 0.25             # 1.0 when image side and road side agree
    snapped_on_side: 0.15            # 1.0 when an edge on the computed side was found within range

snapping:
  max_snap_distance_m: 12.0
  cluster_eps_m: 4.0                # same class + same edge, 1-D along the edge
  footway_connect_distance_m: 5.0   # 6.1 step 4
  dedupe_eps_m: 4.0                 # DBSCAN per class, same edge side
  report_duplicate_distance_m: 4.0  # 6.8 step 5

state:
  staleness_days_permanent: 180

barriers:                    # plan 6.4 step 6 / 3c
  base_confidence: 0.5
  confidence_per_extra_sighting: 0.12
  max_confidence: 0.98
  temporary_min_sightings_for_profile: 3   # below this a flat 0.5 profile is used
  # Severity assigned to detector-only barriers (no human label yet). team_estimate; replaced by
  # the median of labelled severities as soon as a report or label exists.
  default_severity:
    curb_ramp: 1
    steps_or_high_kerb: 4
    broken_surface: 3
    open_drain: 4
    fixed_obstacle: 3
    parked_vehicle: 3
    vendor_encroachment: 3
    bike_barrier: 4

footpath_synthesis:          # plan 6.1 (P1). team_estimate unless noted.
  sidewalk_offset_extra_m: 1.0          # sidewalk centreline = road half width + this
  lane_width_m: 3.5
  default_half_width_m_by_highway:
    trunk: 8.0
    trunk_link: 5.0
    primary: 7.0
    primary_link: 5.0
    secondary: 6.0
    secondary_link: 4.5
    tertiary: 4.5
    tertiary_link: 4.0
    residential: 3.5
    unclassified: 3.5
    service: 2.5
    living_street: 3.0
    default: 3.5
  # Roads that get synthesised left/right sidewalks unless tagged sidewalk=no|none.
  synthesize_for_highway: [trunk, trunk_link, primary, primary_link, secondary, secondary_link,
                           tertiary, tertiary_link, residential, unclassified, living_street, service]
  # service=* values that are walked on the carriageway (no sidewalk synthesised).
  shared_service_types: [driveway, parking_aisle, alley, emergency_access]
  min_sidewalk_length_m: 2.0            # shorter trimmed sidewalks fall back to road_shared
  footway_connect_distance_m: 5.0       # 6.1 step 4
  crossing_node_match_distance_m: 2.0   # OSM highway=crossing node -> parent road
  node_merge_tolerance_m: 0.5           # GeoJSON re-import: endpoints closer than this share a node

routing:                     # plan 6.6
  snap_origin_max_m: 150     # origin/destination must be within this of a graph node
  default_profile: wheelchair_manual
  default_risk: balanced
  unknown_stretch_min_m: 5   # shorter unknown runs are not listed separately

reach:
  default_cutoff_min: 10
  fix_ranking_k: 5

missions:
  random_od_pairs: 500
  top_n: 10

ride:
  accel_hz: 50
  gps_hz: 1
  upload_batch_s: 10
  map_match_distance_m: 10
  verified_fraction_of_edge: 0.8

reports:
  max_photo_gps_offset_m: 50
  rate_limit_per_hour: 30

# Seed (P0 only). Everything produced with these is synthetic=true.
seed:
  random_seed: 42
  n_random_barriers: 30
  observed_edge_fraction: 0.6
  severity_weights: { 1: 1, 2: 2, 3: 3, 4: 2, 5: 1 }
