# User profiles for routing (plan sections 3d, 6.6).
#
# RULE: every number from an Indian standard carries `source:` with a citation, or
# `TODO: cite` until a human confirms it from the document:
#   Harmonised Guidelines and Standards for Universal Accessibility in India 2021 (MoHUA).
# Values marked `team_estimate` are our own routing-design parameters, not standards.
# A null value means "not yet confirmed; code must treat as unknown".

standards:
  # Human task: fill these from the Harmonised Guidelines 2021 and replace the TODO.
  max_ramp_gradient_ratio:
    value: null            # e.g. "1:12" expressed as 0.0833
    source: "TODO: cite Harmonised Guidelines 2021, ramp gradient"
  min_clear_width_m:
    value: null
    source: "TODO: cite Harmonised Guidelines 2021, clear footpath width"
  max_kerb_height_without_ramp_m:
    value: null
    source: "TODO: cite Harmonised Guidelines 2021 / IRC:103, kerb height"
  kerb_ramp_min_width_m:
    value: null
    source: "TODO: cite Harmonised Guidelines 2021, kerb ramp width"

# Route confidence (Phase 2): weighted mix of evidence on the route. team_estimate.
route_confidence:
  weights: { verified: 0.45, freshness: 0.25, barrier_confidence: 0.15, known: 0.15 }
  fresh_image_days: 90          # imagery younger than this is fully fresh; linear decay to 0 at stale_image_days
  stale_image_days: 365
  labels: { high: 0.75, medium: 0.5 }   # score >= high -> "high", >= medium -> "medium", else "low"

# Risk tolerance = how unknown (never observed) edges are costed (plan 6.6).
unknown_multiplier:
  strict: 5.0
  balanced: 1.5
  relaxed: 1.0
  source: team_estimate

# Temporary barriers: above this P(present) they are treated as impassable for
# profiles where the class is impassable; below it, penalty is scaled by P.
temporary_impassable_probability: 0.6   # team_estimate

# Edge-kind rules (plan 6.6, graph kinds from P1). team_estimate. `impassable: true` removes the
# edge for that profile; `penalty_seconds` is added once per edge; `multiplier` scales the travel
# time (walking on the carriageway, road_shared). Crossings use the signalised value when the
# crossing is known to have a signal, otherwise the unsignalised one.
edge_kind_rules:
  walker:
    steps: { penalty_seconds: 5 }
    crossing: { penalty_seconds_signalised: 20, penalty_seconds_unsignalised: 10 }
    connector: { penalty_seconds: 2 }
    road_shared: { multiplier: 1.1 }
  wheelchair_manual:
    steps: { impassable: true }
    crossing: { penalty_seconds_signalised: 30, penalty_seconds_unsignalised: 25, kerb_ramp_missing_impassable: true }
    connector: { penalty_seconds: 5 }
    road_shared: { multiplier: 1.6 }
  elderly_walking_aid:
    steps: { penalty_seconds: 45 }
    crossing: { penalty_seconds_signalised: 30, penalty_seconds_unsignalised: 30 }
    connector: { penalty_seconds: 5 }
    road_shared: { multiplier: 1.4 }
  pram:
    steps: { impassable: true }
    crossing: { penalty_seconds_signalised: 25, penalty_seconds_unsignalised: 20, kerb_ramp_missing_impassable: false }
    connector: { penalty_seconds: 4 }
    road_shared: { multiplier: 1.4 }
  cognitive:
    steps: { penalty_seconds: 20 }
    crossing: { penalty_seconds_signalised: 30, penalty_seconds_unsignalised: 60 }   # unsignalised crossings are hard to judge
    connector: { penalty_seconds: 10 }
    road_shared: { multiplier: 1.8 }
  blind_low_vision:
    steps: { penalty_seconds: 15 }
    crossing: { penalty_seconds_signalised: 30, penalty_seconds_unsignalised: 120 }  # unsignalised crossings: last resort
    connector: { penalty_seconds: 10 }
    road_shared: { multiplier: 2.5 }

# UI mode per profile: move = map + turn banner, explore = camera arrows, listen = voice, baseline = not selectable
profile_modes:
  walker: baseline
  wheelchair_manual: move
  elderly_walking_aid: move
  pram: move
  cognitive: explore
  blind_low_vision: listen

