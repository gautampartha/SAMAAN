[project]
name = "samaan"
version = "0.0.1"
description = "SAMAAN - Walk for All: accessible walking routes from street imagery, built for Indian footpaths (SC-02)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "osmnx>=2.0,<3",
    "networkx>=3.2",
    "shapely>=2.0,<3",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pyyaml>=6.0",
    "requests>=2.32",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["common", "pipeline", "pipeline.graph", "pipeline.seed", "api", "api.routers", "ml", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() in defaults is the framework idiom
